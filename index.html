<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .container{
            width: 80vw; 
           
            background-color: orange;
            border: 1px solid black;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            min-width: 250px;
            gap: 20px;
        }
        .box{
            width: 200px;
            height: 200px;
            border: 1px solid black;
            box-sizing: border-box;

        }
    </style>
</head>
<body>
    <h1>제목</h1>
    <hr>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
</body>
</html>
