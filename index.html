<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인트로 - 운석과 파도</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#02060c;--fg:#eaf4f2}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%}
#replay{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:none;border:1px solid #ffffff55;color:#ffffffcc;font:14px system-ui,sans-serif;padding:8px 14px;border-radius:20px;cursor:pointer;opacity:0;transition:opacity 1s;pointer-events:none}
#replay.on{opacity:1;pointer-events:auto}
#replay:focus-visible{outline:2px solid #fff}
</style>
</head>
<body>
<canvas id="c" aria-label="운석이 수평선에 떨어지고 거대한 파도가 화면을 덮는 인트로 영상"></canvas>
<button id="replay">다시 보기</button>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),btn=document.getElementById('replay');
let W,H,D,HOR,stars=[];
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);HOR=H*0.55;
  stars=Array.from({length:140},()=>({x:Math.random()*W,y:Math.random()*HOR*0.95,r:Math.random()*1.3+.3,p:Math.random()*6}));}
addEventListener('resize',resize);resize();

const TEXT='지금 떠오르는 사람은 누구입니까?';
const T={meteor:0.8,impact:3.2,waveEnd:10,text:10.8,per:0.13};
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
let t0=performance.now(),foam=[];

function frame(now){
  const t=(now-t0)/1000;
  const IX=W*0.62,IY=HOR;
  const sinceImp=t-T.impact;
  // 충격 흔들림
  let sx=0,sy=0;
  if(sinceImp>0&&sinceImp<1.2){const k=(1-sinceImp/1.2)*6;sx=(Math.random()-.5)*k;sy=(Math.random()-.5)*k}
  const p=clamp((t-T.impact-0.4)/(T.waveEnd-T.impact-0.4));
  if(p>0.85){const k=(p-0.85)/0.15*10*(1-clamp((t-T.waveEnd)/0.6));sx+=(Math.random()-.5)*k;sy+=(Math.random()-.5)*k}
  ctx.save();ctx.translate(sx,sy);

  // 하늘
  const glow=clamp(sinceImp/1.5)*(1-clamp((sinceImp-1.5)/5))*0.6;
  let g=ctx.createLinearGradient(0,0,0,HOR);
  g.addColorStop(0,'#03060f');g.addColorStop(.7,`rgb(${14+glow*90},${24+glow*30},${48})`);g.addColorStop(1,`rgb(${30+glow*160},${44+glow*70},${72})`);
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,HOR+20);
  // 별
  for(const s of stars){ctx.globalAlpha=.4+.4*Math.sin(t*2+s.p);ctx.fillStyle='#dfe9ff';ctx.fillRect(s.x,s.y,s.r,s.r)}
  ctx.globalAlpha=1;

  // 바다
  g=ctx.createLinearGradient(0,HOR,0,H);g.addColorStop(0,'#0c1d2c');g.addColorStop(1,'#040a12');
  ctx.fillStyle=g;ctx.fillRect(-20,HOR,W+40,H-HOR+20);
  ctx.strokeStyle='#5f86a833';ctx.lineWidth=1;
  for(let i=0;i<14;i++){const y=HOR+Math.pow(i/14,1.8)*(H-HOR)+2;ctx.beginPath();
    for(let x=0;x<=W;x+=24){const yy=y+Math.sin(x*.02+t*1.5+i)*(1+i*.3);x?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}ctx.stroke()}
  // 수평선 빛
  g=ctx.createLinearGradient(0,HOR-3,0,HOR+3);g.addColorStop(0,'#0000');g.addColorStop(.5,'#9fc4e055');g.addColorStop(1,'#0000');
  ctx.fillStyle=g;ctx.fillRect(0,HOR-3,W,6);

  // 운석
  if(t>T.meteor&&t<T.impact+0.05){
    const m=clamp((t-T.meteor)/(T.impact-T.meteor)),e=m*m;
    const sx0=W*0.95,sy0=-H*0.1;
    const x=sx0+(IX-sx0)*e,y=sy0+(IY-sy0)*e;
    const bx=sx0+(IX-sx0)*Math.max(0,e-.25),by=sy0+(IY-sy0)*Math.max(0,e-.25);
    const tg=ctx.createLinearGradient(bx,by,x,y);tg.addColorStop(0,'#ff8a3000');tg.addColorStop(1,'#ffd9a0');
    ctx.strokeStyle=tg;ctx.lineWidth=2+e*6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(x,y);ctx.stroke();
    const r=6+e*22;g=ctx.createRadialGradient(x,y,0,x,y,r*3);g.addColorStop(0,'#fff');g.addColorStop(.3,'#ffb45a');g.addColorStop(1,'#ff4a0000');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3,0,7);ctx.fill();
  }
  // 충돌 섬광 + 물기둥 + 충격파
  if(sinceImp>0){
    const f=clamp(1-sinceImp/1.4);
    if(f>0){g=ctx.createRadialGradient(IX,IY,0,IX,IY,W*.5);g.addColorStop(0,`rgba(255,240,210,${f})`);g.addColorStop(.25,`rgba(255,150,70,${f*.5})`);g.addColorStop(1,'rgba(255,80,20,0)');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
    const pl=clamp(sinceImp/0.8),fade=1-clamp((sinceImp-0.8)/2);
    if(fade>0){ctx.fillStyle=`rgba(210,230,245,${.7*fade})`;const ph=H*.28*Math.sin(pl*Math.PI*.6)*(1-clamp((sinceImp-1.4)/1.6)*.6);
      ctx.beginPath();ctx.moveTo(IX-W*.02*(1+pl),IY);ctx.quadraticCurveTo(IX-W*.012,IY-ph,IX,IY-ph*1.05);ctx.quadraticCurveTo(IX+W*.012,IY-ph,IX+W*.02*(1+pl),IY);ctx.fill()}
    const rr=sinceImp*W*.35;ctx.strokeStyle=`rgba(200,225,245,${clamp(1-sinceImp/2.2)*.6})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(IX,IY,rr,rr*.06,0,0,7);ctx.stroke();
  }

  // 거대한 파도
  if(p>0){
    const h=Math.pow(p,2.3)*H*1.7+H*.01*p;
    const hw=(0.12+p*1.6)*W;
    const top=x=>{const env=Math.pow(clamp(1-Math.abs(x-IX)/hw),.5);
      return HOR-h*env*(1+.07*Math.sin(x*.012+t*2.5)+.04*Math.sin(x*.041-t*4))+ (p<1? 0:0)};
    g=ctx.createLinearGradient(0,HOR-h,0,H);g.addColorStop(0,'#5f9fa0');g.addColorStop(.12,'#1d5f6e');g.addColorStop(.5,'#0b2b3c');g.addColorStop(1,'#03101a');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-20,H+20);
    for(let x=-20;x<=W+20;x+=6)ctx.lineTo(x,top(x));ctx.lineTo(W+20,H+20);ctx.fill();
    // 물결 결
    ctx.strokeStyle='#9fd6d418';ctx.lineWidth=2;
    for(let i=1;i<7;i++){ctx.beginPath();for(let x=-20;x<=W+20;x+=10){const y=top(x)+i*h*.09+Math.sin(x*.02+t*3+i)*6*p;x<0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
    // 물마루 거품
    ctx.strokeStyle=`rgba(235,250,248,${.5+.4*p})`;ctx.lineWidth=2+p*14;ctx.lineJoin='round';
    ctx.beginPath();for(let x=-20;x<=W+20;x+=6){const y=top(x);x<0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();
    for(let i=0;i<8;i++){const x=Math.random()*W,y=top(x);if(y>-40&&y<H)foam.push({x,y,vx:(Math.random()-.5)*2,vy:-Math.random()*3*(1+p*2),l:1})}
    for(const f of foam){f.x+=f.vx;f.y+=f.vy;f.vy+=.12;f.l-=.02;ctx.fillStyle=`rgba(240,252,250,${clamp(f.l)*.8})`;ctx.fillRect(f.x,f.y,2+p*4,2+p*4)}
    foam=foam.filter(f=>f.l>0);
    // 화면 전체가 물에 잠김
    const cover=clamp((t-(T.waveEnd-1.6))/1.8);
    if(cover>0){ctx.fillStyle=`rgba(3,14,22,${cover})`;ctx.fillRect(-20,-20,W+40,H+40)}
  }
  ctx.restore();

  // 문구
  if(t>T.text){
    const n=Math.min(TEXT.length,Math.floor((t-T.text)/T.per)+1);
    const fs=Math.min(W*0.05,56);
    ctx.font=`700 ${fs}px "Nanum Myeongjo","Noto Serif KR","Malgun Gothic",serif`;
    ctx.textAlign='left';ctx.textBaseline='middle';
    const full=ctx.measureText(TEXT).width,sx0=(W-full)/2,shown=TEXT.slice(0,n);
    ctx.shadowColor='#7fdcd455';ctx.shadowBlur=18;ctx.fillStyle='#eaf4f2';
    ctx.fillText(shown,sx0,H/2);ctx.shadowBlur=0;
    const done=n>=TEXT.length,cx=sx0+ctx.measureText(shown).width+4;
    if(!done||Math.floor(t*2)%2===0){ctx.fillRect(cx,H/2-fs*.55,2,fs*1.1)}
    if(done&&t-T.text>TEXT.length*T.per+1.2)btn.classList.add('on');
  }
  requestAnimationFrame(frame);
}
btn.onclick=()=>{t0=performance.now();foam=[];btn.classList.remove('on')};
requestAnimationFrame(frame);
setTimeout(function() {
    location.href = 'main.html';
}, 3000);
</script>
</body>
</html>
