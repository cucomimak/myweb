<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cute+Font&display=swap" rel="stylesheet">
    <style>
        *{
            margin: 0px auto;
            text-align: center;
        }
        body, textarea{
            font-family: 'Cute Font', sans-serif;
            font-size: 16px;
            line-height: 1.6;
        }
        .bold-text {
            font-weight: 700; /* 두꺼운 글씨 */
        }
        .container{
            padding-top: 10px;
            padding-bottom: 10px;
            position: relative;
            width: 600px;
            height: 400px;
            background-color: khaki;
            box-sizing: border-box;
        }
        #sender, #receiver{
            margin: 10px;
        }
        #sender{
            position: absolute;
            top: 10px;
            left: 20px;
        }
        #receiver{
            position: absolute;
            bottom: 10px;
            right: 20px;
        }
        h2{
            margin-top: 20px;
        }

    </style>
</head>
<body>
    
    <div class="container">
        
        <div id="sender">
            <h2>보내는 분의 주소를 입력하세요</h2>
            <textarea cols="50" rows="3"></textarea>
        </div>
        
        <div id="receiver">
            <h2>받으실 분의 주소를 입력하세요</h2>
            <textarea cols="50" rows="3"></textarea>
        </div>
    </div>
</body>
</html>
